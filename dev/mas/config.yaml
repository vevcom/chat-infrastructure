# MAS for development: the service that signs users in to Synapse. The values here that are
# secrets anywhere else are fixed, except the keys, which make_keys.py makes on the first start.

http:
    # Where the browser reaches MAS, which is also the issuer of its tokens.
    public_base: http://account.chat.localhost:8091/
    listeners:
        - name: web
          resources:
              - name: discovery
              - name: human
              - name: oauth
              - name: compat
              - name: graphql
              - name: assets
              # The admin api, which the application deactivates accounts through.
              - name: adminapi
              - name: health
          binds:
              - address: "[::]:8080"

database:
    uri: postgresql://chat:chat@postgres/mas

matrix:
    kind: synapse
    homeserver: chat.localhost
    endpoint: http://synapse:8008/
    secret: omegaweb-dev-mas-shared-secret

secrets:
    encryption_file: /secrets/encryption
    keys_dir: /secrets/keys

# MAS sends no mail: it knows no password to recover and verifies no address.
email:
    transport: blackhole

# No one has a password here. Everyone signs in through the application.
passwords:
    enabled: false

# The account is what it is in the application, so nothing about it is changed here.
account:
    email_change_allowed: false
    displayname_change_allowed: false
    password_change_allowed: false
    password_registration_enabled: false
    password_recovery_enabled: false
    account_deactivation_allowed: false

# The application as a client of MAS's admin api, which it signs in to with this secret and no
# user. It deactivates accounts through it, and gets its admin access to Synapse from it.
clients:
    - client_id: 0000000000000000000MEGAWEB
      client_auth_method: client_secret_basic
      client_secret: omegaweb-dev-mas-client-secret

policy:
    data:
        admin_clients:
            - 0000000000000000000MEGAWEB
        client_registration:
            # The chat client registers itself by its own address, which is plain http here.
            allow_insecure_uris: true
