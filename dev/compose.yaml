# The chat for development: Synapse, the homeserver, MAS, which signs users in to it, and the
# Element Web client, on plain http. An application's compose file includes this file, see the
# README at the root of the repo. On its own, from this directory:
#
#     docker compose up -d
#
# See README.md for the addresses and how the application connects.

# The project's name when the file is run on its own. An including file's own name wins.
name: chat-dev

services:
    postgres:
        image: postgres:18.6
        environment:
            POSTGRES_USER: chat
            POSTGRES_PASSWORD: chat
        volumes:
            - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
            # Postgres 18 keeps its data in a subdirectory of this mount, see its image notes.
            - postgres-data:/var/lib/postgresql
        healthcheck:
            test: [CMD-SHELL, "pg_isready -U chat -d mas"]
            interval: 2s
            timeout: 2s
            retries: 30

    # Makes Synapse's signing key and MAS's keys on the first start, and nothing after it. It runs
    # as root to write to the volumes, so it hands Synapse's over to the user Synapse runs as.
    keys:
        image: ghcr.io/element-hq/synapse:v1.165.0
        entrypoint: [sh, -c]
        command:
            - python -m synapse.app.homeserver --config-path /config/homeserver.yaml --generate-keys
              && chown -R 991:991 /data
              && python /mas/make_keys.py
        environment:
            PYTHONPATH: /modules
            OPENSSL_armcap: "0"
        volumes:
            - ./synapse:/config:ro
            - ../synapse:/modules:ro
            - ./mas/make_keys.py:/mas/make_keys.py:ro
            - synapse-data:/data
            - mas-secrets:/secrets

    synapse:
        image: ghcr.io/element-hq/synapse:v1.165.0
        depends_on:
            postgres:
                condition: service_healthy
            keys:
                condition: service_completed_successfully
        environment:
            SYNAPSE_CONFIG_PATH: /config/homeserver.yaml
            # Where Synapse finds the module homeserver.yaml names.
            PYTHONPATH: /modules
            # OpenSSL in this image crashes with "Illegal instruction" on an Apple M4 under an old
            # Docker Desktop, see README.md. This stops it from probing what the processor can do,
            # and does nothing on a processor that is not ARM.
            OPENSSL_armcap: "0"
        ports:
            # Opened by the client in the browser, as http://matrix.chat.localhost:8008.
            - "127.0.0.1:8008:8008"
        volumes:
            - ./synapse:/config:ro
            - ../synapse:/modules:ro
            - synapse-data:/data

    mas:
        image: ghcr.io/element-hq/matrix-authentication-service:1.29.0
        depends_on:
            postgres:
                condition: service_healthy
            keys:
                condition: service_completed_successfully
        command: [server, --config, /config/config.yaml]
        # The provider MAS signs users in through is the application, published on the machine's
        # port 3000, see README.md.
        extra_hosts:
            - auth.localhost:host-gateway
        ports:
            # Opened as http://account.chat.localhost:8091, the address in config.yaml.
            - "127.0.0.1:8091:8080"
        volumes:
            - ./mas/config.yaml:/config/config.yaml:ro
            - mas-secrets:/secrets:ro

    element:
        image: ghcr.io/element-hq/element-web:v1.12.35
        ports:
            # Opened as http://chat.localhost:8090.
            - "127.0.0.1:8090:80"
        volumes:
            - ./element/config.json:/app/config.json:ro

volumes:
    postgres-data:
    synapse-data:
    mas-secrets:
