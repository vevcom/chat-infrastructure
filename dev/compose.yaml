# The chat for development: Synapse, the homeserver, MAS, which signs users in to it, and the
# Element Web client, on plain http. They run on the config of deploy/base, which is production's,
# with this directory's site files beside it. An application's compose file includes this file, see
# the README at the root of the repo. On its own, from this directory:
#
#     docker compose up -d
#
# See README.md for the addresses and how the application connects.

# The project's name when the file is run on its own. An including file's own name wins.
name: chat-dev

# The services and volumes that are not named for what they run are named for the chat, since an
# including project has a database and volumes of its own.
services:
    chat-db:
        image: postgres:18.6
        environment:
            POSTGRES_USER: chat
            POSTGRES_PASSWORD: chat
        volumes:
            - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
            # Postgres 18 keeps its data in a subdirectory of this mount, see its image notes.
            - chat-db-data:/var/lib/postgresql
        # The name production's database service has, which the config of deploy/base names.
        networks:
            default:
                aliases: [chat-db-rw]
        healthcheck:
            test: [CMD-SHELL, "pg_isready -U chat -d mas"]
            interval: 2s
            timeout: 2s
            retries: 30

    # What production's pods are given or do before Synapse and MAS start: the secrets as files,
    # the application service registration from its template, and Synapse's signing key. It runs as
    # root to write to the volumes, so it hands Synapse's over to the user Synapse runs as.
    chat-keys:
        image: ghcr.io/element-hq/synapse:v1.165.0
        entrypoint: [sh, -c]
        command:
            - python /prepare.py
              && python /config/render_registration.py
              && python -m synapse.app.homeserver -c /config/homeserver.yaml -c /site/site.yaml --generate-keys
              && chown -R 991:991 /data
        environment:
            PYTHONPATH: /config
            OPENSSL_armcap: "0"
            # The values that are secrets in production, fixed here since nothing outside the
            # machine reaches this stack. PGPASSWORD is the database's, as chat-db has it.
            SYNAPSE_MACAROON_SECRET: omegaweb-dev-macaroon
            SYNAPSE_FORM_SECRET: omegaweb-dev-form
            MAS_SHARED_SECRET: omegaweb-dev-mas-shared-secret
            CHAT_MAS_CLIENT_SECRET: omegaweb-dev-mas-client-secret
            PGPASSWORD: chat
            # What the registration is rendered with, see deploy/base/synapse/appservice.yaml.
            CHAT_AS_TOKEN: omegaweb-dev-as-token
            CHAT_HS_TOKEN: omegaweb-dev-hs-token
            # Where Synapse sends every event, which the including application sets to its own address.
            # Left unset, Synapse sends none.
            CHAT_APPSERVICE_URL: ${CHAT_APPSERVICE_URL:-}
            CHAT_SERVER_NAME: chat.localhost
        volumes:
            - ../deploy/base/synapse:/config:ro
            - ./synapse:/site:ro
            - ./prepare.py:/prepare.py:ro
            - synapse-data:/data
            - chat-secrets:/secrets
            - chat-registration:/registration

    synapse:
        image: ghcr.io/element-hq/synapse:v1.165.0
        depends_on:
            chat-db:
                condition: service_healthy
            chat-keys:
                condition: service_completed_successfully
        command: [run, --config-path, /config/homeserver.yaml, --config-path, /site/site.yaml]
        environment:
            # Where Synapse finds the module site.yaml names.
            PYTHONPATH: /config
            PGPASSWORD: chat
            # OpenSSL in this image crashes with "Illegal instruction" on an Apple M4 under an old
            # Docker Desktop, see README.md. This stops it from probing what the processor can do,
            # and does nothing on a processor that is not ARM.
            OPENSSL_armcap: "0"
        ports:
            # Opened by the client in the browser, as http://matrix.chat.localhost:8008.
            - "127.0.0.1:8008:8008"
        volumes:
            - ../deploy/base/synapse:/config:ro
            - ./synapse:/site:ro
            - synapse-data:/data
            - chat-secrets:/secrets:ro
            - chat-registration:/registration:ro

    mas:
        image: ghcr.io/element-hq/matrix-authentication-service:1.29.0
        depends_on:
            chat-db:
                condition: service_healthy
            chat-keys:
                condition: service_completed_successfully
        command: [server, --config, /config/config.yaml, --config, /site/site.yaml]
        # MAS exits when its worker loses its lease on the queue, which a machine that sleeps makes
        # it do. Production's Deployment starts it again, and so does this.
        restart: unless-stopped
        # The provider MAS signs users in through is the application, published on the machine's
        # port 3000, see README.md.
        extra_hosts:
            - auth.localhost:host-gateway
        ports:
            # Opened as http://account.chat.localhost:8091, the address in site.yaml.
            - "127.0.0.1:8091:8080"
            # The admin api, which production never publishes. Here it is, for check.sh.
            - "127.0.0.1:8092:8081"
        volumes:
            - ../deploy/base/mas:/config:ro
            - ./mas:/site:ro
            - chat-secrets:/secrets:ro

    element:
        image: ghcr.io/element-hq/element-web:v1.12.35
        ports:
            # Opened as http://chat.localhost:8090.
            - "127.0.0.1:8090:80"
        volumes:
            - ./element/config.json:/app/config.json:ro

volumes:
    chat-db-data:
    synapse-data:
    chat-secrets:
    chat-registration:
