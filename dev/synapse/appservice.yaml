# The application as an application service: the registration that tells Synapse it exists.
#
# `as_token` is what the application calls Synapse with. A call is made as the bot,
# @omegaweb:chat.localhost, or as any user the namespace covers when it names one in `user_id`.
# The namespace covers every user of this server, so the application can put a user in a space and
# take them out without an invite to accept. It is not exclusive: the users are created by MAS.
#
# `url` is where Synapse sends every event, signed with `hs_token`. Without one it sends none.
id: omegaweb
url: null
as_token: omegaweb-dev-as-token
hs_token: omegaweb-dev-hs-token
sender_localpart: omegaweb
rate_limited: false
namespaces:
    users:
        - exclusive: false
          regex: "@.*:chat\\.localhost"
    aliases: []
    rooms: []
